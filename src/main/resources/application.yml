spring:
  application:
    name: volunteer-api
  datasource:
    # Either a full JDBC URL, or host/port/name parts (Render's managed Postgres exposes the parts).
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commonground}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Used to build links (e.g. password reset) that point back at the web app.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    # No email provider yet: reset links are printed to the log instead of emailed.
    log-reset-links: ${LOG_RESET_LINKS:true}
  google:
    # Comma-separated OAuth client IDs whose ID tokens are accepted (web + Android). Empty disables Google sign-in.
    client-ids: ${GOOGLE_CLIENT_IDS:}
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  # Creates the Green Roots demo organization and accounts on startup (local development only).
  seed-demo: ${SEED_DEMO:false}

---
spring:
  config:
    activate:
      on-profile: local
app:
  seed-demo: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3123,http://127.0.0.1:3123}

---
spring:
  config:
    activate:
      on-profile: docker
