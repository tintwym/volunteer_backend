# Render has no native Java runtime, so the service uses runtime "docker": Render builds the
# Dockerfile on its own servers. Nothing needs to be installed locally.
# The database is Neon; set the secrets below in the Render dashboard (Environment tab).
services:
  - type: web
    name: commonground-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # jdbc:postgresql://<neon-host>/neondb?sslmode=require  (or Neon's postgresql://user:pass@host/db URL)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://commonground-volunteer.vercel.app,https://volunteer-management.vercel.app,http://localhost:3000
      - key: FRONTEND_URL
        value: https://commonground-volunteer.vercel.app
      # Creates the Green Roots demo organization so the login page's demo buttons work.
      - key: SEED_DEMO
        value: "true"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      # Gemini assistant (POST /api/chat). Set the key in the Render dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_ENABLED
        value: "true"
